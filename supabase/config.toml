project_id = "project-m"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
enable_signup = false
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://student.localhost:3000/**",
]

[auth.email]
enable_signup = true

[auth.hook.before_user_created]
uri = "pg-functions://postgres/public/before_user_created_institutional"

[storage]
enabled = true
file_size_limit = "25MiB"
